workflows:
  android-apk:
    name: Pradip Homeo Android APK
    max_build_duration: 60

    environment:
      flutter: stable
      java: 17

    scripts:
      - name: Check Flutter environment
        script: |
          cd flutter_app
          flutter --version
          dart --version

      - name: Install dependencies
        script: |
          cd flutter_app
          flutter pub get

      - name: Generate Drift code
        script: |
          cd flutter_app
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze project
        script: |
          cd flutter_app
          flutter analyze

      - name: Run tests
        script: |
          cd flutter_app
          flutter test

      - name: Build release APK
        script: |
          cd flutter_app
          flutter build apk --release

      - name: Verify APK
        script: |
          cd flutter_app
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

    artifacts:
      - flutter_app/build/app/outputs/flutter-apk/app-release.apk
