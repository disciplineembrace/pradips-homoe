name: pradips_homeo
description: >-
  Offline-first Flutter Android app for Pradip's Homoeopathy library.
  Connects to existing live website backend (Next.js + Supabase + Neon PostgreSQL).
  Uses Drift/SQLCipher for ENCRYPTED local offline storage.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^2.5.1

  # Local database (offline-first) — drift + sqlcipher for ENCRYPTION
  drift: ^2.16.0
  sqlcipher_flutter_libs: ^0.6.4

  # Networking
  dio: ^5.5.0

  # Secure storage (Android Keystore) — stores the SQLCipher encryption key
  flutter_secure_storage: ^9.2.2

  # Connectivity detection
  connectivity_plus: ^6.0.3

  # Utilities
  json_annotation: ^4.9.0
  logger: ^2.3.0
  intl: ^0.19.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation — drift_dev MUST match drift version
  build_runner: ^2.4.11
  drift_dev: ^2.16.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
